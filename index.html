<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEARING SCHOOL v3.1 - Clinical Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4FD1C5; --secondary: #F6AD55; --accent: #B794F4; --success: #48BB78; --danger: #F56565; --bg: #F0FFF4; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; position: relative; overflow: hidden; min-height: 550px; }
        
        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .feedback-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 150px; z-index: 100; display: none; pointer-events: none; }
        .firework { color: #FFD700; text-shadow: 0 0 20px gold; }
        .cross { color: var(--danger); }

        .word-card { background: #F7FAFC; padding: 40px 10px; border-radius: 20px; margin: 15px 0; border: 3px dashed #CBD5E0; }
        .btn { border: none; padding: 15px 25px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; color: white; width: 100%; margin: 5px 0; transition: 0.3s; font-family: 'Mitr'; }
        .btn-start { background: var(--primary); }
        .btn-speak { background: var(--secondary); font-size: 24px; }
        .btn-medicine { background: var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        select, input { width: 95%; padding: 12px; margin: 8px 0; border: 2px solid #E2E8F0; border-radius: 12px; font-size: 16px; }
        .badge { background: #E9D8FD; color: #6B46C1; padding: 5px 15px; border-radius: 50px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <!-- Visual Feedback -->
    <div id="fireworkIcon" class="feedback-overlay firework">🎆</div>
    <div id="crossIcon" class="feedback-overlay cross">❌</div>

    <!-- หน้า 1: หน้าหลัก -->
    <div id="setupScreen" class="screen active">
        <h2>🏫 HEARING SCHOOL</h2>
        <p style="color:#718096; margin-top:-10px;">โรงเรียนวัดหนองโพรง</p>
        
        <div style="text-align:left; padding:10px;">

            <select id="studentSelect" onchange="updateProgressHint()">

            </select>
            <div id="progressHint" style="font-size:12px; color:var(--primary); min-height:15px; margin-bottom:10px;"></div>
            
            <label><b>2. ชั้นเรียน:</b></label>
            <input type="text" id="roomInput" value="ป.1/1">
        </div>

        <button class="btn btn-start" onclick="startTestSequence()" id="startBtn" disabled>รอข้อมูล... 🚀</button>
    </div>

    <!-- หน้า 2: หน้าแนะนำระดับ (Tutorial) - มีเสียงอัตโนมัติ -->
    <div id="tutorialScreen" class="screen">
        <div class="badge" id="tutLevelBadge">ระดับ R1</div>
        <h3>📝 คำชี้แจง</h3>
        <p id="tutInstruction" style="color:#4A5568;">ให้อ่านคำที่ปรากฏทั้งหมด 10 คำให้ถูกต้อง</p>
        <div class="word-card">
            <small>ตัวอย่างวิธีการอ่าน:</small>
            <h1 id="tutWordDisplay" style="font-size:80px; margin:10px 0;">ก</h1>
            <p id="tutReadingHint" style="color:var(--accent); font-weight:bold;"></p>
        </div>
        <p style="color:var(--secondary);">🚀 กำลังเริ่มการทดสอบใน 5 วินาที...</p>
    </div>

    <!-- หน้า 3: หน้าทดสอบจริง -->
    <div id="practiceScreen" class="screen">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
            <span id="displayName"></span>
            <span id="displayCount" style="font-weight:bold; color:var(--primary);">คำที่ 1/10</span>
        </div>
        <div id="rLevelBadge" class="badge"></div>
        <div class="word-card">
            <h1 id="wordDisplay" style="font-size:100px; margin:0;">?</h1>
        </div>
        <div id="resultText" style="margin:10px 0; font-weight:bold; color:#718096;">คลิกปุ่มไมค์แล้วเริ่มอ่าน</div>
        <button class="btn btn-speak" onclick="startListening()">🎤 คลิกเพื่ออ่าน</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn" style="background:var(--success)" onclick="handleResult(true)">✔️ ถูกต้อง</button>
            <button class="btn" style="background:var(--danger)" onclick="handleResult(false)">❌ ติดขัด</button>
        </div>
    </div>

    <!-- หน้า 4: หน้าซ่อมเสริม (ยารักษา) -->
    <div id="medicineScreen" class="screen">
        <div style="font-size:60px;">💊</div>
        <h3>คลินิกการพัฒนาการอ่าน</h3>
        <p id="failReason" style="color:var(--danger); font-weight:bold;"></p>
        <div class="word-card" style="text-align:left;">
            <b>📋 วิธีการรักษา/ฝึกฝน:</b>
            <p id="medicineAdvice" style="font-size:14px;"></p>
        </div>

        <button class="btn" style="background:#4A5568; margin-top:20px;" onclick="location.reload()">🏠 กลับหน้าหลัก (คนถัดไป)</button>
    </div>
</div>

    let allStudents = [], lastStatusMap = {}, currentStudent = "", currentRoom = "";
    let testWords = [], currentIndex = 0, currentR = "", medicineLink = "";

    window.onload = () => {
        fetch(GOOGLE_URL).then(res => res.json()).then(data => {
            allStudents = data.names;
            lastStatusMap = data.lastStatus;
            const select = document.getElementById('studentSelect');
            select.innerHTML = '<option value="">-- เลือกนักเรียน --</option>';
            allStudents.forEach(n => {
                let info = lastStatusMap[n] ? ` [${lastStatusMap[n].level}]` : " [ใหม่]";
                select.innerHTML += `<option value="${n}">${n}${info}</option>`;
            });
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').innerText = 'เริ่มทดสอบ 🚀';
        });
    };

    function updateProgressHint() {
        let name = document.getElementById('studentSelect').value;
        let hint = document.getElementById('progressHint');
        hint.innerText = lastStatusMap[name] ? `ล่าสุด: ระดับ ${lastStatusMap[name].level}` : "นักเรียนใหม่ (เริ่ม R1)";
    }

    function startTestSequence() {
        currentStudent = document.getElementById('studentSelect').value;
        currentRoom = document.getElementById('roomInput').value;
        if(!currentStudent) return alert("เลือกชื่อนักเรียนก่อนครับ");
        
        currentR = lastStatusMap[currentStudent] ? lastStatusMap[currentStudent].level : "R1";
        setupLevel(currentR);
    }

    function setupLevel(rCode) {
        currentR = rCode;
        let pool = wordBank.filter(d => d.r === rCode);
        if(pool.length === 0) { alert("จบการประเมินทุกระดับ"); location.reload(); return; }
        
        // สุ่มคำ 10 คำ (หรือเท่าที่มีถ้าไม่ถึง 10)
        testWords = pool.sort(() => Math.random() - 0.5).slice(0, 10);
        currentIndex = 0;
        showTutorial();
    }

    function showTutorial() {
        showScreen('tutorialScreen');
        let sample = wordBank.find(d => d.r === currentR);
        document.getElementById('tutLevelBadge').innerText = `ระดับ ${currentR}`;
        document.getElementById('tutWordDisplay').innerText = sample.word;
        document.getElementById('tutReadingHint').innerText = `วิธีอ่าน: ${sample.sample}`;
        
        // เสียงอ่านอัตโนมัติ (ครั้งเดียว)
        let msg = new SpeechSynthesisUtterance(`ยินดีต้อนรับสู่ระดับ ${currentR} วิธีอ่านคำตัวอย่างคือ ${sample.sample} เตรียมตัวเริ่มทดสอบจริงนะคะ`);
        msg.lang = 'th-TH'; window.speechSynthesis.speak(msg);

        setTimeout(startActualTest, 6000);
    }

    function startActualTest() {
        showScreen('practiceScreen');
        updatePracticeDisplay();
    }

    function updatePracticeDisplay() {
        let item = testWords[currentIndex];
        document.getElementById('displayName').innerText = currentStudent;
        document.getElementById('displayCount').innerText = `คำที่ ${currentIndex+1}/${testWords.length}`;
        document.getElementById('rLevelBadge').innerText = `${item.r}`;
        document.getElementById('wordDisplay').innerText = item.word;
        document.getElementById('resultText').innerText = "พร้อมฟังแล้ว...";
    }

    function startListening() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "th-TH";
        document.getElementById("resultText").innerText = "👂 กำลังฟัง...";
        recognition.start();
        recognition.onresult = (e) => {
            let spoken = e.results[0][0].transcript;
            if(spoken.includes(testWords[currentIndex].word)) handleResult(true);
            else document.getElementById("resultText").innerText = `❌ ได้ยินว่า: ${spoken}`;
        };
    }

    function handleResult(isPass) {
        let icon = isPass ? document.getElementById('fireworkIcon') : document.getElementById('crossIcon');
        icon.style.display = 'block';
        if(isPass) { 
            let m = new SpeechSynthesisUtterance("เก่งมากค่ะ"); m.lang='th-TH'; window.speechSynthesis.speak(m);
        }
        
        setTimeout(() => {
            icon.style.display = 'none';
            if(isPass) {
                saveToCloud("ผ่าน");
                if(currentIndex < testWords.length - 1) {
                    currentIndex++; updatePracticeDisplay();
                } else {
                    alert("ยอดเยี่ยม! ผ่านครบ 10 คำแล้ว");
                    moveToNextR();
                }
            } else {
                showMedicine();
            }
        }, 1200);
    }

    function showMedicine() {
        let item = testWords[currentIndex];
        saveToCloud("ติดขัด");
        showScreen('medicineScreen');
        document.getElementById('failReason').innerText = `ติดขัดที่ระดับ ${currentR}: ${item.word}`;
        document.getElementById('medicineAdvice').innerText = item.advice;
        medicineLink = item.drive; // เก็บลิงก์ Drive ไว้กดเปิด
    }

    function openMedicineDrive() {
        if(medicineLink.includes("http")) window.open(medicineLink, '_blank');
        else alert("ยังไม่ได้ใส่ลิงก์ Google Drive ในฐานข้อมูล");
    }

    function moveToNextR() {
        let rs = ["R1", "R2", "R3", "R4", "R5"];
        let next = rs[rs.indexOf(currentR) + 1];
        if(next) setupLevel(next); else location.reload();
    }

    function saveToCloud(status) {
        let item = testWords[currentIndex];
        let data = {
            student: currentStudent, room: currentRoom, word: item.word,
            rLevel: currentR, status: status, wordIndex: currentIndex,
            advice: item.advice, coaching: "-", referral: "-"
        };
        fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
