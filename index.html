<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมฝึกอ่านภาษาไทย - สถิติรายบุคคล</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4FD1C5; --secondary: #ED8936; --success: #38A169; --danger: #E53E3E; --dark: #2D3748; }
        body { font-family: 'Sarabun', sans-serif; background-color: #F4F9F9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        
        /* สไตล์หน้าเข้าสู่ระบบ */
        #loginScreen { display: block; }
        #practiceScreen { display: none; }
        
        input[type="text"] { width: 80%; padding: 12px; margin: 15px 0; border: 2px solid #E2E8F0; border-radius: 12px; font-size: 18px; text-align: center; }
        
        .level-info { color: #718096; font-size: 0.9rem; margin-bottom: 10px; background: #EDF2F7; padding: 5px 15px; border-radius: 50px; display: inline-block; }
        h1 { font-size: 70px; color: var(--dark); margin: 10px 0; }
        
        .btn { border: none; padding: 14px 28px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s; color: white; width: 100%; margin-bottom: 10px; }
        .btn-start { background-color: var(--primary); }
        .btn-speak { background-color: var(--secondary); box-shadow: 0 4px 12px rgba(237, 137, 54, 0.4); }
        .btn-report { background-color: #4A5568; margin-top: 20px; }
        
        #resultText { height: 60px; margin: 15px 0; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        
        .report-panel { display: none; margin-top: 20px; text-align: left; background: #EDF2F7; padding: 20px; border-radius: 12px; font-size: 14px; max-height: 200px; overflow-y: auto; }
        .student-name-display { font-weight: bold; color: var(--primary); margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- หน้าเข้าสู่ระบบ (กรอกชื่อ) -->
<div id="loginScreen" p="loginScreen class="card">
    <h2>สวัสดีครับ/ค่ะ</h2>
    <p>กรุณาพิมพ์ชื่อผู้ใช้งานเพื่อเริ่มบันทึกผล</p>
    <input type="text" id="studentNameInput" placeholder="พิมพ์ชื่อของคุณที่นี่...">
    <input type="text" p="studentRoomInput" placeholder="พิมพ์ชั้นของคุณที่นี่...">
    <button class="btn btn-start" onclick="startApp()">เข้าสู่บทเรียน</button>
</div>

<!-- หน้าฝึกอ่าน -->
<div id="practiceScreen" class="card">
    <div class="student-name-display">ผู้อ่าน: <span id="displayName"></span></div>
    <div class="student-room-display">ชั้น: <span p="displayRoom"></span></div>
    <div id="levelDisplay" class="level-info">สระ ะ</div>
    <p>คำที่ <span id="wordNumber">1</span> จากทั้งหมด</p>
    <h1 id="wordDisplay">กะ</h1>

    <div id="resultText">กดปุ่มสีส้มแล้วพูดตามคำข้างบน</div>

    <button class="btn btn-speak" onclick="startListening()">🎤 คลิกเพื่ออ่านออกเสียง</button>
    <button class="btn btn-report" onclick="toggleReport()">📊 ดูสถิติของฉัน</button>
    
    <div id="reportPanel" class="report-panel">
        <strong>สถิติการอ่านรายคน:</strong>
        <div id="statsContent">กำลังโหลด...</div>
        <hr>
        <button onclick="logout()" style="border:none; background:none; color:red; cursor:pointer; font-size:12px;">ออกจากระบบ (เปลี่ยนคนอ่าน)</button>
    </div>
</div>

<script>
    // URL สำหรับเชื่อม Google Sheets (ใส่ URL ของคุณที่ได้จาก Apps Script)
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwUwSuiJZz3f9G3pQ_Zl9gXsUFOF8SvYvoyrhFNLHDAfbZJW91lnh_-4ZT3PuKKVc6GeA/exec";

    // รายการคำที่จัดเรียงตามเงื่อนไข (ะ -> า -> ผสม -> ิ -> ผสม -> ตัวสะกด)
    const wordList = [
        { word: "กะ", level: "สระ ะ (พยัญชนะเดี่ยว)" },
        { word: "ชะ", level: "สระ ะ (พยัญชนะเดี่ยว)" },
        { word: "กระ", level: "สระ ะ (อักษรควบ)" },
        { word: "ขะ", level: "สระ ะ (อักษรนำ)" },
        { word: "กา", level: "สระ า" },
        { word: "มา", level: "สระ า" },
        { word: "ปลา", level: "สระ า (อักษรควบ)" },
        { word: "กะลา", level: "ผสม ะ และ า (2 คำ)" },
        { word: "มะระ", level: "ผสม ะ และ า (2 คำ)" },
        { word: "ปิติ", level: "สระ ิ" },
        { word: "มะลิ", level: "ผสม ะ และ ิ (2 คำ)" },
        { word: "บิดา", level: "ผสม ิ และ า (2 คำ)" },
        { word: "กะทิสด", level: "ผสม ะ ิ และตัวสะกด" },
        { word: "นกกระจิบ", level: "คำที่มีตัวสะกด" },
        { word: "กินข้าว", level: "คำที่มีตัวสะกด" }
    ];

    let currentStudent = "";
    let currentIndex = 0;
    let attempts = 0;

    function startApp() {
        const nameInput = document.getElementById("studentNameInput").value;
        if (nameInput.trim() === "") {
            alert("กรุณาใส่ชื่อก่อนเริ่มนะครับ");
            return;
        }
        currentStudent = nameInput;
        document.getElementById("displayName").innerText = currentStudent;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("practiceScreen").style.display = "block";
        updateDisplay();
    }

    function updateDisplay() {
        const current = wordList[currentIndex];
        document.getElementById("wordDisplay").innerText = current.word;
        document.getElementById("wordNumber").innerText = currentIndex + 1;
        document.getElementById("levelDisplay").innerText = "ระดับ: " + current.level;
        document.getElementById("resultText").innerText = "กดปุ่มไมค์เพื่ออ่านคำว่า " + current.word;
        document.getElementById("resultText").style.color = "#718096";
        attempts = 0;
    }

    function startListening() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("เบราว์เซอร์นี้ไม่รองรับระบบเสียง แนะนำให้ใช้ Chrome บนมือถือหรือคอมพิวเตอร์ครับ");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "th-TH";
        const resultElement = document.getElementById("resultText");
        
        resultElement.innerText = "正在听... กำลังฟัง...";
        resultElement.style.color = "#D69E2E";
        attempts++;

        recognition.start();

        recognition.onresult = function(event) {
            const spokenText = event.results[0][0].transcript;
            const targetWord = wordList[currentIndex].word;

            if (spokenText.includes(targetWord)) {
                resultElement.innerText = "🎉 ถูกต้อง! เก่งมากครับ";
                resultElement.style.color = "#38A169";
                saveStatsToSheet(targetWord, wordList[currentIndex].level, "ผ่าน", attempts);
                
                setTimeout(() => {
                    if (currentIndex < wordList.length - 1) {
                        currentIndex++;
                        updateDisplay();
                    } else {
                        resultElement.innerText = "🎊 เยี่ยมมาก! คุณเรียนจบทุกบทเรียนแล้ว";
                        setTimeout(() => { logout(); }, 5000);
                    }
                }, 2000);
            } else {
                resultElement.innerText = `คุณอ่านว่า "${spokenText}" (ลองอีกครั้งนะ)`;
                resultElement.style.color = "#E53E3E";
            }
        };
    }

    function saveStatsToSheet(word, level, status, count) {
        // บันทึกลง LocalStorage สำหรับดูรายงานหน้าเว็บ
        let localData = JSON.parse(localStorage.getItem('readingData_' + currentStudent)) || [];
        localData.push({ word, level, status, count, time: new Date().toLocaleString() });
        localStorage.setItem('readingData_' + currentStudent, JSON.stringify(localData));

        // ส่งไปยัง Google Sheets
        if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== "https://script.google.com/macros/s/AKfycbwUwSuiJZz3f9G3pQ_Zl9gXsUFOF8SvYvoyrhFNLHDAfbZJW91lnh_-4ZT3PuKKVc6GeA/exec") {
            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify({
                    student: currentStudent,
                    word: word,
                    level: level,
                    status: status,
                    attempts: count
                })
            });
        }
    }

    function toggleReport() {
        const panel = document.getElementById("reportPanel");
        const statsContent = document.getElementById("statsContent");
        
        if (panel.style.display === "none" || panel.style.display === "") {
            panel.style.display = "block";
            let localData = JSON.parse(localStorage.getItem('readingData_' + currentStudent)) || [];
            if (localData.length === 0) {
                statsContent.innerHTML = "ยังไม่มีข้อมูลการอ่าน";
            } else {
                statsContent.innerHTML = localData.map(item => 
                    `• ${item.word} (${item.count} ครั้ง) - <small>${item.time}</small>`
                ).join('<br>');
            }
        } else {
            panel.style.display = "none";
        }
    }

    function logout() {
        if(confirm("ต้องการเปลี่ยนผู้ใช้งานหรือเริ่มต้นใหม่ใช่หรือไม่?")) {
            location.reload();
        }
    }
</script>

</body>
</html>
