<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมฝึกอ่านประเมินระดับ R1-R8</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4FD1C5; --secondary: #ED8936; --success: #38A169; --danger: #E53E3E; --dark: #2D3748; }
        body { font-family: 'Sarabun', sans-serif; background-color: #F4F9F9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); max-width: 550px; width: 100%; text-align: center; }
        
        #loginScreen { display: block; }
        #practiceScreen { display: none; }
        
        input[type="text"] { width: 85%; padding: 12px; margin: 10px 0; border: 2px solid #E2E8F0; border-radius: 12px; font-size: 18px; text-align: center; }
        
        .badge { display: inline-block; padding: 5px 15px; border-radius: 50px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
        .badge-r { background: #E9D8FD; color: #6B46C1; }
        
        h1 { font-size: 80px; color: var(--dark); margin: 15px 0; }
        .btn { border: none; padding: 15px 28px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s; color: white; width: 100%; margin-bottom: 10px; }
        .btn-start { background-color: var(--primary); }
        .btn-speak { background-color: var(--secondary); box-shadow: 0 4px 12px rgba(237, 137, 54, 0.4); }
        
        #resultText { height: 70px; margin: 15px 0; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 12px; padding: 10px; }
        .report-panel { display: none; margin-top: 20px; text-align: left; background: #EDF2F7; padding: 20px; border-radius: 12px; font-size: 14px; max-height: 300px; overflow-y: auto; }
        
        .student-info-bar { display: flex; justify-content: space-between; font-size: 14px; color: #4A5568; margin-bottom: 15px; border-bottom: 1px solid #CBD5E0; padding-bottom: 10px; }
    </style>
</head>
<body>

<!-- หน้าจอลงชื่อเข้าใช้ -->
<div id="loginScreen" class="card">
    <h2>แบบทดสอบการอ่านรายบุคคล</h2>
    <p>กรุณากรอกข้อมูลเพื่อเริ่มการประเมิน</p>
    <input type="text" id="studentNameInput" placeholder="ชื่อ-นามสกุล">
    <input type="text" id="studentRoomInput" placeholder="ชั้น / ห้อง (เช่น ป.1/2)">
    <button class="btn btn-start" onclick="startApp()">เริ่มทดสอบ</button>
</div>

<!-- หน้าจอฝึกอ่าน -->
<div id="practiceScreen" class="card">
    <div class="student-info-bar">
        <span>👤 ผู้อ่าน: <b id="displayName"></b></span>
        <span>🏫 ชั้น: <b id="displayRoom"></b></span>
    </div>

    <div id="rLevelBadge" class="badge badge-r">R1: จดจำอักษร</div>
    <p>คำฝึกอ่านที่ <span id="wordNumber">1</span></p>
    <h1 id="wordDisplay">ก</h1>

    <div id="resultText" style="background: #fdfdfd;">กดปุ่มสีส้มเพื่อเริ่มอ่าน</div>

    <button class="btn btn-speak" onclick="startListening()">🎤 คลิกเพื่ออ่านออกเสียง</button>
    <button class="btn" style="background:#4A5568" onclick="toggleReport()">📊 ดูรายงานผล/คำแนะนำ</button>
    
    <div id="reportPanel" class="report-panel">
        <h3 style="margin-top:0">สรุปการประเมิน</h3>
        <div id="statsContent">กำลังประมวลผล...</div>
        <hr>
        <button onclick="location.reload()" style="background:none; border:none; color:var(--secondary); cursor:pointer;">↩️ เปลี่ยนผู้เรียน</button>
    </div>
</div>

<script>
    // *** แก้ไข URL ของคุณที่นี่ ***
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxRyJPJr5l2E-VbEbXrYpCG6LKivaDijuegcSQVjtPmM7ulhVDqBmDfvM4gx6xuvqBRzw/exec";

    // รายการคำที่แบ่งระดับตาม R1-R8
    const wordList = [
        { word: "ก", r: "R1", desc: "จดจำอักษร", advice: "ฝึกท่องพยัญชนะ ก-ฮ และสระ" },
        { word: "สระอา", r: "R1", desc: "จดจำอักษร", advice: "เน้นการจำรูปสระ" },
        { word: "กะ", r: "R2", desc: "ผสมคำพื้นฐาน", advice: "ฝึกแจกลูกคำสระเดี่ยว" },
        { word: "ตา", r: "R2", desc: "ผสมคำพื้นฐาน", advice: "ฝึกแจกลูกคำสระเสียงยาว" },
        { word: "กล้า", r: "R3", desc: "คำซับซ้อน", advice: "ฝึกอักษรควบและวรรณยุกต์" },
        { word: "หยุด", r: "R3", desc: "คำซับซ้อน", advice: "เน้นอักษรนำ (ห นำ)" },
        { word: "กะลาสี", r: "R4", desc: "อ่านคำต่อเนื่อง", advice: "ฝึกอ่านคำ 2-3 พยางค์ต่อเนื่อง" },
        { word: "ไปโรงเรียน", r: "R5", desc: "อ่านข้อความ", advice: "ฝึกอ่านประโยคสั้นๆ ในชีวิตประจำวัน" }
        // เพิ่มคำและระดับ R6-R8 ได้ตามต้องการ
    ];

    let currentStudent = "";
    let currentRoom = "";
    let currentIndex = 0;
    let attempts = 0;

    function startApp() {
        const nameInput = document.getElementById("studentNameInput").value;
        const roomInput = document.getElementById("studentRoomInput").value;
        
        if (!nameInput || !roomInput) {
            alert("กรุณากรอกทั้งชื่อและชั้นเรียนครับ");
            return;
        }

        currentStudent = nameInput;
        currentRoom = roomInput;
        
        document.getElementById("displayName").innerText = currentStudent;
        document.getElementById("displayRoom").innerText = currentRoom;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("practiceScreen").style.display = "block";
        
        updateDisplay();
    }

    function updateDisplay() {
        const item = wordList[currentIndex];
        document.getElementById("wordDisplay").innerText = item.word;
        document.getElementById("wordNumber").innerText = currentIndex + 1;
        document.getElementById("rLevelBadge").innerText = `${item.r}: ${item.desc}`;
        document.getElementById("resultText").innerText = "พร้อมฟังแล้วครับ...";
        document.getElementById("resultText").style.backgroundColor = "#fdfdfd";
        attempts = 0;
    }

    function startListening() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "th-TH";
        
        document.getElementById("resultText").innerText = "กำลังฟัง...";
        attempts++;

        recognition.start();

        recognition.onresult = function(event) {
            const spoken = event.results[0][0].transcript;
            const target = wordList[currentIndex].word;

            if (spoken.includes(target)) {
                handleSuccess(spoken);
            } else {
                handleFailure(spoken);
            }
        };
    }

    function handleSuccess(spoken) {
        const item = wordList[currentIndex];
        const resDiv = document.getElementById("resultText");
        resDiv.innerText = `✅ ถูกต้อง! (คุณพูดว่า: ${spoken})`;
        resDiv.style.backgroundColor = "#C6F6D5";

        saveData("ผ่าน", attempts, "ผ่านเกณฑ์ระดับนี้");

        setTimeout(() => {
            if (currentIndex < wordList.length - 1) {
                currentIndex++;
                updateDisplay();
            } else {
                alert("สิ้นสุดการทดสอบครบทุกระดับแล้ว");
                toggleReport();
            }
        }, 2000);
    }

    function handleFailure(spoken) {
        const resDiv = document.getElementById("resultText");
        resDiv.innerText = `❌ ยังไม่ชัด (คุณอ่านว่า: ${spoken}) ลองใหม่นะครับ`;
        resDiv.style.backgroundColor = "#FED7D7";
        
        // ถ้าพยายามเกิน 3 ครั้ง ให้ถือว่า "ควรปรับปรุงในระดับนี้"
        if (attempts >= 3) {
            const item = wordList[currentIndex];
            saveData("ควรปรับปรุง", attempts, item.advice);
            alert(`แนะนำ: ดูเหมือนจะติดขัดที่ระดับ ${item.r}\nข้อแนะนำ: ${item.advice}`);
        }
    }

    function saveData(status, count, advice) {
        const item = wordList[currentIndex];
        
        // 1. บันทึกในเครื่อง (Local) เพื่อแสดงรายงานทันที
        let history = JSON.parse(localStorage.getItem('R_Stats_' + currentStudent)) || [];
        history.push({
            word: item.word,
            rLevel: item.r,
            status: status,
            attempts: count,
            advice: advice,
            time: new Date().toLocaleString()
        });
        localStorage.setItem('R_Stats_' + currentStudent, JSON.stringify(history));

        // 2. ส่งไป Google Sheets
        fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                student: currentStudent,
                room: currentRoom,
                word: item.word,
                rLevel: item.r,
                status: status,
                attempts: count,
                advice: advice
            })
        });
        updateStatsUI();
    }

    function updateStatsUI() {
        const history = JSON.parse(localStorage.getItem('R_Stats_' + currentStudent)) || [];
        const content = document.getElementById("statsContent");
        
        if (history.length === 0) {
            content.innerHTML = "ยังไม่มีข้อมูลการทดสอบ";
            return;
        }

        content.innerHTML = history.reverse().map(h => `
            <div style="margin-bottom:10px; padding:10px; background:white; border-radius:8px; border-left:4px solid ${h.status === 'ผ่าน' ? '#38A169' : '#E53E3E'}">
                <b>${h.rLevel}: ${h.word}</b> - ${h.status} (${h.attempts} ครั้ง)<br>
                <small style="color:#718096">คำแนะนำ: ${h.advice}</small>
            </div>
        `).join('');
    }

    function toggleReport() {
        const panel = document.getElementById("reportPanel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
        updateStatsUI();
    }
</script>

</body>
</html>
