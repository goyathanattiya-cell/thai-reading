<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEARING SCHOOL v3.2 - Complete Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4FD1C5; --secondary: #F6AD55; --accent: #B794F4; --success: #48BB78; --danger: #F56565; --bg: #F0FFF4; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; position: relative; overflow: hidden; min-height: 550px; border: 5px solid white; }
        
        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #E6FFFA; border: 2px solid var(--primary); padding: 10px; border-radius: 15px; }
        .stat-num { font-size: 24px; font-weight: bold; color: var(--primary); }

        .feedback-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 150px; z-index: 100; display: none; pointer-events: none; }
        .word-card { background: #F7FAFC; padding: 40px 10px; border-radius: 20px; margin: 15px 0; border: 3px dashed #CBD5E0; }
        .btn { border: none; padding: 15px 25px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; color: white; width: 100%; margin: 5px 0; transition: 0.3s; font-family: 'Mitr'; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-start { background: var(--primary); }
        .btn-speak { background: var(--secondary); font-size: 24px; }
        .btn-report { background: var(--accent); }
        
        select, input { width: 95%; padding: 12px; margin: 8px 0; border: 2px solid #E2E8F0; border-radius: 12px; font-size: 16px; }
        .badge { background: #E9D8FD; color: #6B46C1; padding: 5px 15px; border-radius: 50px; font-weight: bold; display: inline-block; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #EDF2F7; }
    </style>
</head>
<body>

<div class="container">
    <div id="fireworkIcon" class="feedback-overlay">🎆</div>
    <div id="crossIcon" class="feedback-overlay">❌</div>

    <!-- หน้า 1: หน้าหลัก & Dashboard -->
    <div id="setupScreen" class="screen active">
        <h2>🏫 HEARING SCHOOL</h2>
        <div class="dashboard">
            <div class="stat-card"><div class="stat-num" id="countR1">0</div><small>R1</small></div>
            <div class="stat-card"><div class="stat-num" id="countR2">0</div><small>R2</small></div>
            <div class="stat-card"><div class="stat-num" id="countR35">0</div><small>R3-5</small></div>
        </div>
        
        <div style="text-align:left; padding:10px;">
            <label><b>1. เลือกนักเรียน:</b></label>
            <select id="studentSelect" onchange="updateProgressHint()">
                <option value="">-- กำลังโหลดรายชื่อ --</option>
            </select>
            <div id="progressHint" style="font-size:12px; color:var(--primary); min-height:15px; margin-bottom:10px;"></div>
            
            <label><b>2. ชั้นเรียน:</b></label>
            <input type="text" id="roomInput" value="ป.1/1">
        </div>

        <button class="btn btn-start" onclick="startTestSequence()" id="startBtn" disabled>รอโหลดข้อมูล... 🚀</button>
        <button class="btn btn-report" onclick="showSummary()">📊 รายงานและส่งออกข้อมูล</button>
    </div>

    <!-- หน้า 2: โหมดตัวอย่าง -->
    <div id="tutorialScreen" class="screen">
        <div class="badge" id="tutLevelBadge">ระดับ R1</div>
        <h3>📝 คำชี้แจง</h3>
        <p style="color:#4A5568;">ให้อ่านคำที่ปรากฏทั้งหมด 10 คำให้ถูกต้อง</p>
        <div class="word-card">
            <small>ตัวอย่างวิธีการอ่าน:</small>
            <h1 id="tutWordDisplay" style="font-size:80px; margin:10px 0;">ก</h1>
            <p id="tutReadingHint" style="color:var(--accent); font-weight:bold;"></p>
        </div>
        <p style="color:var(--secondary); font-weight:bold;">🚀 กำลังเริ่มการทดสอบใน 5 วินาที...</p>
    </div>

    <!-- หน้า 3: หน้าทดสอบจริง -->
    <div id="practiceScreen" class="screen">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
            <span id="displayName"></span>
            <span id="displayCount" style="font-weight:bold; color:var(--primary);">คำที่ 1/10</span>
        </div>
        <div id="rLevelBadge" class="badge"></div>
        <div class="word-card">
            <h1 id="wordDisplay" style="font-size:90px; margin:0;">?</h1>
        </div>
        <div id="resultText" style="margin:10px 0; font-weight:bold; color:#718096;">คลิกปุ่มไมค์แล้วเริ่มอ่าน</div>
        <button class="btn btn-speak" onclick="startListening()">🎤 คลิกเพื่ออ่าน</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn" style="background:var(--success)" onclick="handleResult(true)">✔️ ถูกต้อง</button>
            <button class="btn" style="background:var(--danger)" onclick="handleResult(false)">❌ ติดขัด</button>
        </div>
    </div>

    <!-- หน้า 4: หน้าซ่อมเสริม -->
    <div id="medicineScreen" class="screen">
        <div style="font-size:60px;">💊</div>
        <h3>คลินิกการพัฒนาการอ่าน</h3>
        <p id="failReason" style="color:var(--danger); font-weight:bold;"></p>
        <div class="word-card" style="text-align:left;">
            <b>📋 วิธีการรักษา/ฝึกฝน:</b>
            <p id="medicineAdvice" style="font-size:14px;"></p>
        </div>
        <button class="btn btn-start" style="background:var(--accent)" id="driveLinkBtn" onclick="openMedicineDrive()">📺 รับสื่อการสอน (ยารักษา)</button>
        <button class="btn" style="background:#4A5568; margin-top:20px;" onclick="location.reload()">🏠 กลับหน้าหลัก (เปลี่ยนคน)</button>
    </div>

    <!-- หน้า 5: รายงานสรุป -->
    <div id="reportPanel" class="screen">
        <h3>📊 สรุปผลการอ่าน</h3>
        <button class="btn" style="background:#38A169" onclick="exportToCSV()">📥 ส่งออกไฟล์ CSV (Excel)</button>
        <div id="statsTableHolder" style="max-height: 400px; overflow-y: auto;"></div>
        <button class="btn btn-start" onclick="showScreen('setupScreen')">🏠 กลับหน้าหลัก</button>
    </div>
</div>

<script>
    // *** สำคัญ: นำ URL ที่ได้จากขั้นตอน Deploy มาใส่ที่นี่ ***
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzBHT2_Gt_oJc3c1GP7S_L5w5WSzhQX6ycmJbi5jbU04D-tDcaTlPlH-JVLZdutWGkB/exec";

    const wordBank = [
        { word: "ก", r: "R1", sample: "กอ-ไก่", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "ค", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "ต", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "ฒ", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "ฬ", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "อี", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "แอะ", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "เอือ", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "เอาะ", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        { word: "เอีย", r: "R1", drive: "https://drive.google.com/drive/folders/1wszaHWdF_WxGK3S4VWMNtIbuMOLnxqQG?usp=sharing", advice: "R1: ใช้เพลงสระ/พยัญชนะ และแบบฝึกสื่อสี" },
        
        { word: "จะ", r: "R2", sample: "จอ-อะ-จะ", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "ปะ", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "ขา", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "มา", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "ดุ", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "ปู", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "ฟู", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "ไป", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "มือ", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        { word: "เละ", r: "R2", drive: "https://drive.google.com/drive/folders/13DqSkUEOE18J8krAUYNwcOy6I5MsSKbu?usp=sharing", advice: "R2: สอนชี้มือที่ตัวหนังสือที่ออกเสียง และแจกลูกสะกดคำ" },
        
        { word: "กล้า", r: "R3", sample: "กอ-ลอ-อา-กลา-ไม้โท-กล้า", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นคำควบกล้ำ ชี้มือตามตัวอักษรแล้วกลับมาชี้พยัญชนะต้น" },
        { word: "ครัว", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นคำควบกล้ำ ชี้มือตามตัวอักษรแล้วกลับมาชี้พยัญชนะต้น" },
        { word: "เพลีย", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นคำควบกล้ำ ชี้มือตามตัวอักษรแล้วกลับมาชี้พยัญชนะต้น" },
        { word: "ปลูก", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นคำควบกล้ำ ชี้มือตามตัวอักษรแล้วกลับมาชี้พยัญชนะต้น" },
        { word: "กว้าง", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นคำควบกล้ำ ชี้มือตามตัวอักษรแล้วกลับมาชี้พยัญชนะต้น" },
        { word: "จริง", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นคำควบกล้ำ ชี้มือตามตัวอักษรแล้วกลับมาชี้พยัญชนะต้น" },
        { word: "ทราบ", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นคำควบกล้ำ ชี้มือตามตัวอักษรแล้วกลับมาชี้พยัญชนะต้น" },
        { word: "หมอน", r: "R3", sample: "หอ-มอ-ออ-นอ-หมอน", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นอักษรนำ ชี้มือตามตัวอักษร" },
        { word: "หยุด", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นอักษรนำ ชี้มือตามตัวอักษร" },
        { word: "อย่า", r: "R3", drive: "https://drive.google.com/drive/folders/1aLddxbzkNW9uUthZACnQIe4-CTgfByD4?usp=sharing", advice: "R3: เน้นอักษรนำ ชี้มือตามตัวอักษร" },

        { word: "กากี", r: "R4", drive: "https://drive.google.com/drive/folders/1-IU9lmRTN1AN1pTIJjhpAJW9wrMaRK7u?usp=sharing", advice: "R4: ฝึกอ่านคำต่อเนื่อง" },
        { word: "ดีเดย์", r: "R4", drive: "https://drive.google.com/drive/folders/1-IU9lmRTN1AN1pTIJjhpAJW9wrMaRK7u?usp=sharing", advice: "R4: ฝึกอ่านคำต่อเนื่อง" },
        { word: "กีฬา", r: "R4", drive: "https://drive.google.com/drive/folders/1-IU9lmRTN1AN1pTIJjhpAJW9wrMaRK7u?usp=sharing", advice: "R4: ฝึกอ่านคำต่อเนื่อง" },
        { word: "ประกาศ", r: "R4", drive: "https://drive.google.com/drive/folders/1-IU9lmRTN1AN1pTIJjhpAJW9wrMaRK7u?usp=sharing", advice: "R4: ฝึกอ่านคำต่อเนื่อง" },
        { word: "นิสัย", r: "R4", drive: "https://drive.google.com/drive/folders/1-IU9lmRTN1AN1pTIJjhpAJW9wrMaRK7u?usp=sharing", advice: "R4: ฝึกอ่านคำต่อเนื่อง" },

        { word: "หนูอยากไปโรงเรียน", r: "R5", drive: "https://drive.google.com/drive/folders/1BImvrjS70q3zommAYTSTMq4xJhaWYPJH?usp=sharing", advice: "R5: ฝึกอ่านประโยค" },
        { word: "วารีไปดูกีฬาที่สนาม", r: "R5", drive: "https://drive.google.com/drive/folders/1BImvrjS70q3zommAYTSTMq4xJhaWYPJH?usp=sharing", advice: "R5: ฝึกอ่านประโยค" }
    ];

    let allStudents = [], lastStatusMap = {}, allHistory = [];
    let testWords = [], currentIndex = 0, currentR = "", medicineLink = "";

    window.onload = () => {
        fetch(GOOGLE_URL).then(res => res.json()).then(data => {
            allStudents = data.names;
            lastStatusMap = data.lastStatus;
            allHistory = data.allHistory;
            populateDropdown();
            updateDashboard();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').innerText = 'เริ่มทดสอบ 🚀';
        }).catch(e => alert("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + e));
    };

    function populateDropdown() {
        const select = document.getElementById('studentSelect');
        select.innerHTML = '<option value="">-- เลือกนักเรียน --</option>';
        allStudents.forEach(n => {
            let info = lastStatusMap[n] ? ` [${lastStatusMap[n].level}]` : " [ใหม่]";
            select.innerHTML += `<option value="${n}">${n}${info}</option>`;
        });
    }

    function updateDashboard() {
        let r1 = 0, r2 = 0, r35 = 0;
        Object.values(lastStatusMap).forEach(v => {
            if (v.level == "R1") r1++;
            else if (v.level == "R2") r2++;
            else r35++;
        });
        document.getElementById('countR1').innerText = r1;
        document.getElementById('countR2').innerText = r2;
        document.getElementById('countR35').innerText = r35;
    }

    function updateProgressHint() {
        let name = document.getElementById('studentSelect').value;
        let hint = document.getElementById('progressHint');
        hint.innerText = lastStatusMap[name] ? `ล่าสุด: ระดับ ${lastStatusMap[name].level}` : "นักเรียนใหม่ (เริ่ม R1)";
    }

    function startTestSequence() {
        let name = document.getElementById('studentSelect').value;
        let room = document.getElementById('roomInput').value;
        if(!name) return alert("เลือกชื่อนักเรียนก่อนครับ");
        
        currentStudent = name;
        currentRoom = room;
        currentR = lastStatusMap[name] ? lastStatusMap[name].level : "R1";
        setupLevel(currentR);
    }

    function setupLevel(rCode) {
        currentR = rCode;
        let pool = wordBank.filter(d => d.r === rCode);
        if(pool.length === 0) { alert("จบการประเมินทุกระดับ"); location.reload(); return; }
        
        testWords = pool.sort(() => Math.random() - 0.5).slice(0, 10);
        currentIndex = 0;
        showTutorial();
    }

    function showTutorial() {
        showScreen('tutorialScreen');
        let sample = wordBank.find(d => d.r === currentR) || wordBank[0];
        document.getElementById('tutLevelBadge').innerText = `ระดับ ${currentR}`;
        document.getElementById('tutWordDisplay').innerText = sample.word;
        document.getElementById('tutReadingHint').innerText = `วิธีอ่าน: ${sample.sample || '-'}`;
        
        let msg = new SpeechSynthesisUtterance(`ยินดีต้อนรับสู่ระดับ ${currentR} วิธีอ่านคำตัวอย่างคือ ${sample.sample || sample.word} เตรียมตัวเริ่มทดสอบจริงนะคะ`);
        msg.lang = 'th-TH'; window.speechSynthesis.speak(msg);

        setTimeout(startActualTest, 6000);
    }

    function startActualTest() {
        showScreen('practiceScreen');
        updatePracticeDisplay();
    }

    function updatePracticeDisplay() {
        let item = testWords[currentIndex];
        document.getElementById('displayName').innerText = currentStudent;
        document.getElementById('displayCount').innerText = `คำที่ ${currentIndex+1}/${testWords.length}`;
        document.getElementById('rLevelBadge').innerText = `${item.r}`;
        document.getElementById('wordDisplay').innerText = item.word;
        document.getElementById('resultText').innerText = "พร้อมฟังแล้ว...";
    }

    function startListening() {
        const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        recognition.lang = "th-TH";
        document.getElementById("resultText").innerText = "👂 กำลังฟัง...";
        recognition.start();
        recognition.onresult = (e) => {
            let spoken = e.results[0][0].transcript;
            if(spoken.includes(testWords[currentIndex].word)) handleResult(true);
            else document.getElementById("resultText").innerText = `❌ ได้ยินว่า: ${spoken}`;
        };
    }

    function handleResult(isPass) {
        let icon = isPass ? document.getElementById('fireworkIcon') : document.getElementById('crossIcon');
        icon.style.display = 'block';
        if(isPass) { 
            let m = new SpeechSynthesisUtterance("เก่งมากค่ะ"); m.lang='th-TH'; window.speechSynthesis.speak(m);
        }
        
        setTimeout(() => {
            icon.style.display = 'none';
            if(isPass) {
                saveToCloud("ผ่าน");
                if(currentIndex < testWords.length - 1) {
                    currentIndex++; updatePracticeDisplay();
                } else {
                    alert("ยอดเยี่ยม! ผ่านครบระดับแล้ว");
                    moveToNextR();
                }
            } else {
                showMedicine();
            }
        }, 1200);
    }

    function showMedicine() {
        let item = testWords[currentIndex];
        saveToCloud("ติดขัด");
        showScreen('medicineScreen');
        document.getElementById('failReason').innerText = `ติดขัดที่ระดับ ${currentR}: ${item.word}`;
        document.getElementById('medicineAdvice').innerText = item.advice;
        medicineLink = item.drive;
    }

    function openMedicineDrive() {
        if(medicineLink.includes("http")) window.open(medicineLink, '_blank');
        else alert("ยังไม่ได้ใส่ลิงก์ Drive");
    }

    function moveToNextR() {
        let rs = ["R1", "R2", "R3", "R4", "R5"];
        let next = rs[rs.indexOf(currentR) + 1];
        if(next) setupLevel(next); else location.reload();
    }

    function saveToCloud(status) {
        let item = testWords[currentIndex];
        let data = {
            student: currentStudent, room: currentRoom, word: item.word,
            rLevel: currentR, status: status, wordIndex: currentIndex,
            advice: item.advice
        };
        fetch(GOOGLE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showSummary() {
        showScreen('reportPanel');
        let html = `<table><tr><th>วันที่</th><th>ชื่อ</th><th>ระดับ</th><th>คำ</th><th>ผล</th></tr>`;
        allHistory.slice().reverse().forEach(h => {
            html += `<tr><td>${new Date(h.time).toLocaleDateString()}</td><td>${h.name}</td><td>${h.level}</td><td>${h.word}</td><td>${h.status}</td></tr>`;
        });
        html += `</table>`;
        document.getElementById('statsTableHolder').innerHTML = html;
    }

    function exportToCSV() {
        let csv = "\ufeffวัน-เวลา,ชื่อ,ชั้น,ระดับ,คำ,สถานะ\n";
        allHistory.forEach(h => {
            csv += `${h.time},${h.name},${h.room},${h.level},${h.word},${h.status}\n`;
        });
        let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "รายงานการอ่าน.csv";
        link.click();
    }
</script>
</body>
</html>
