<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมฝึกอ่านภาษาไทย</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4FD1C5; --secondary: #ED8936; --success: #38A169; --danger: #E53E3E; }
        body { font-family: 'Sarabun', sans-serif; background-color: #F4F9F9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        .level-info { color: #718096; font-size: 0.9rem; margin-bottom: 10px; }
        h1 { font-size: 80px; color: #2D3748; margin: 10px 0; }
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .btn { border: none; padding: 12px 24px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s; color: white; }
        .btn-listen { background-color: var(--primary); }
        .btn-speak { background-color: var(--secondary); }
        .btn-report { background-color: #4A5568; margin-top: 20px; }
        #resultText { height: 50px; margin: 15px 0; font-weight: bold; }
        .report-panel { display: none; margin-top: 20px; text-align: left; background: #EDF2F7; padding: 15px; border-radius: 12px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <div class="level-info" id="levelDisplay">ระดับ: สระ ะ</div>
    <p>คำที่ <span id="wordNumber">1</span></p>
    <h1 id="wordDisplay">กะ</h1>

    <div id="resultText">กดปุ่มสีส้มเพื่อเริ่มอ่าน</div>

    <div class="btn-group">
        <button class="btn btn-speak" onclick="startListening()">🎤 ฝึกอ่านออกเสียง</button>
    </div>

    <button class="btn btn-report" onclick="toggleReport()">📊 ดูรายงานผล</button>
    
    <div id="reportPanel" class="report-panel">
        <strong>สถิติการใช้งาน:</strong>
        <div id="statsContent">ยังไม่มีข้อมูล</div>
        <hr>
        <button onclick="clearStats()" style="font-size: 10px;">ล้างข้อมูลใหม่ทั้งหมด</button>
    </div>
</div>

<script>
    // 1. รายการคำ (เนื้อหาตามที่คุณต้องการ)
    const wordList = [
        // สระ ะ (พยัญชนะเดี่ยว, ควบ, นำ)
        { word: "กะ", level: "สระ ะ (พยัญชนะเดี่ยว)" },
        { word: "จะ", level: "สระ ะ (พยัญชนะเดี่ยว)" },
        { word: "กระ", level: "สระ ะ (อักษรควบ)" },
        { word: "พระ", level: "สระ ะ (อักษรควบ)" },
        { word: "ขะ", level: "สระ ะ (อักษรนำ)" },
        // สระ า
        { word: "กา", level: "สระ า" },
        { word: "ตา", level: "สระ า" },
        { word: "ปลา", level: "สระ า (ควบกล้ำ)" },
        // คำ 2 คำติดกัน (ะ และ า)
        { word: "กะลา", level: "ประผสม ะ และ า" },
        { word: "มะระ", level: "ประผสม ะ และ า" },
        // สระ ิ
        { word: "กิติ", level: "สระ ิ" },
        { word: "มะลิ", level: "ประสม ะ และ ิ" },
        // 3 คำติดกัน
        { word: "บิดามาระ", level: "ประสม ะ า ิ" },
        { word: "กะทิสด", level: "คำที่มีตัวสะกด" }
    ];

    let currentIndex = 0;
    let attempts = 0;
    let stats = JSON.parse(localStorage.getItem('readingStats')) || { totalRead: 0, success: 0 };

    // ใส่ URL ของ Google Apps Script ที่คุณได้จาก "ส่วนที่ 1" ตรงนี้
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzfIE_CP0w6VfRQMJRtXSMajFhmiHjVIcjfhKNcCOJJ0Sa-CaPyGgO0W6fSouROxSWPaA/exec"; 

    function updateDisplay() {
        const current = wordList[currentIndex];
        document.getElementById("wordDisplay").innerText = current.word;
        document.getElementById("wordNumber").innerText = currentIndex + 1;
        document.getElementById("levelDisplay").innerText = "ระดับ: " + current.level;
        document.getElementById("resultText").innerText = "พร้อมสำหรับคำใหม่...";
        document.getElementById("resultText").style.color = "#718096";
        attempts = 0;
    }

    function playAudio() {
        const utterance = new SpeechSynthesisUtterance(wordList[currentIndex].word);
        utterance.lang = "th-TH";
        window.speechSynthesis.speak(utterance);
    }

    function startListening() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "th-TH";
        const resultElement = document.getElementById("resultText");
        
        resultElement.innerText = "กำลังฟัง...";
        attempts++;

        recognition.start();

        recognition.onresult = function(event) {
            const spokenText = event.results[0][0].transcript;
            const targetWord = wordList[currentIndex].word;

            if (spokenText.includes(targetWord)) {
                resultElement.innerText = "🎉 เก่งมาก! อ่านถูกต้อง";
                resultElement.style.color = "#38A169";
                saveStats(targetWord, "ผ่าน", attempts);
                
                setTimeout(() => {
                    if (currentIndex < wordList.length - 1) {
                        currentIndex++;
                        updateDisplay();
                    } else {
                        alert("ยินดีด้วย! คุณเรียนจบทุกบทเรียนแล้ว");
                        currentIndex = 0;
                        updateDisplay();
                    }
                }, 2000);
            } else {
                resultElement.innerText = `คุณอ่านว่า "${spokenText}" ลองใหม่อีกครั้งนะ`;
                resultElement.style.color = "#E53E3E";
            }
        };
    }

    function saveStats(word, status, count) {
        stats.totalRead++;
        if(status === "ผ่าน") stats.success++;
        localStorage.setItem('readingStats', JSON.stringify(stats));
        updateStatsDisplay();

        // ส่งข้อมูลไป Google Sheets
        if(GOOGLE_SHEET_URL !== "ใส่_URL_ที่นี่") {
            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ word: word, status: status, attempts: count })
            });
        }
    }

    function updateStatsDisplay() {
        document.getElementById("statsContent").innerHTML = `
            อ่านไปแล้ว: ${stats.totalRead} ครั้ง<br>
            สำเร็จ: ${stats.success} คำ<br>
            อัตราความสำเร็จ: ${Math.round((stats.success/stats.totalRead)*100) || 0}%
        `;
    }

    function toggleReport() {
        const panel = document.getElementById("reportPanel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
        updateStatsDisplay();
    }

    function clearStats() {
        localStorage.removeItem('readingStats');
        stats = { totalRead: 0, success: 0 };
        updateStatsDisplay();
    }

    updateDisplay();
</script>

</body>
</html>
